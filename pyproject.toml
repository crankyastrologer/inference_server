[project]
name = "nanoserve"
version = "0.0.0"
description = "A paged-KV, continuously-batched LLM inference server, built from scratch."
readme = "PLAN.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.14.0",
    "transformers==5.16.1",
    "tokenizers==0.23.2",
    "safetensors==0.8.0",
    "numpy==2.4.6",
    "huggingface-hub==1.30.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "sse-starlette==3.4.10",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
